  <title>Gisheh</title>
  <desc>A cinema ticket with a play symbol</desc>

  <!-- Bottom profile: the subtle depth used by GNOME app icons. -->
  <path fill="#613583" d="M24 18h80a8 8 0 0 1 8 8v22c-8 0-14 7-14 16s6 16 14 16v26a8 8 0 0 1-8 8H24a8 8 0 0 1-8-8V80c8 0 14-7 14-16s-6-16-14-16V26a8 8 0 0 1 8-8Z"/>

  <!-- Ticket face. Flat color is intentional: the surface is straight. -->
  <path fill="#9141ac" d="M24 14h80a8 8 0 0 1 8 8v22c-8 0-14 7-14 16s6 16 14 16v26a8 8 0 0 1-8 8H24a8 8 0 0 1-8-8V76c8 0 14-7 14-16s-6-16-14-16V22a8 8 0 0 1 8-8Z"/>

  <!-- Perforation: large details remain legible at 32 px. -->
  <path fill="#c061cb" d="M32 26h4v10h-4zm0 22h4v10h-4zm0 24h4v10h-4zm0 22h4v6h-4zM92 26h4v10h-4zm0 22h4v10h-4zm0 24h4v10h-4zm0 22h4v6h-4z"/>

