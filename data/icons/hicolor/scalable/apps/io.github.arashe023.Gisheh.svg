<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Gisheh — Saved ticket</title>
  <desc>A purple cinema ticket with an ivory bookmark, representing a personal film and television watchlist.</desc>
  <!-- Four-unit front profile; the complete silhouette rests at y=112. -->
  <path fill="#613583" d="M28 20h72a12 12 0 0 1 12 12v30a10 10 0 0 0 0 20v18a12 12 0 0 1-12 12H28a12 12 0 0 1-12-12V82a10 10 0 0 0 0-20V32a12 12 0 0 1 12-12Z"/>
  <!-- Flat paper surface, using the GNOME purple palette. -->
  <path fill="#9141ac" d="M28 16h72a12 12 0 0 1 12 12v30a10 10 0 0 0 0 20v18a12 12 0 0 1-12 12H28a12 12 0 0 1-12-12V78a10 10 0 0 0 0-20V28a12 12 0 0 1 12-12Z"/>
  <!-- One large bookmark: the V-shaped end remains open at small sizes. -->
  <path fill="#f6f5f4" d="M48 28h32a4 4 0 0 1 4 4v48L64 68 44 80V32a4 4 0 0 1 4-4Z"/>
  <!-- Three broad perforations suggest the retained ticket stub. -->
  <path fill="#dc8add" d="M36 92h8v4h-8Zm24 0h8v4h-8Zm24 0h8v4h-8Z"/>
</svg>
